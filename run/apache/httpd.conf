ServerRoot /home/yasser/BSS_Project/development-demo/run/apache
PidFile /home/yasser/BSS_Project/development-demo/run/apache/run/httpd.pid
ErrorLog /home/yasser/BSS_Project/development-demo/run/apache/logs/error.log
CustomLog /home/yasser/BSS_Project/development-demo/run/apache/logs/access.log combined
TypesConfig /etc/mime.types
User yasser
Group yasser
Listen 8091

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule mono_module /usr/lib/apache2/modules/mod_mono.so

MonoServerPath /usr/bin/mod-mono-server4
MonoDebug true
AddHandler mono .aspx .ascx .aspx.cs .aspx.vb .asmx .ashx .asax .axd .config .cs

ServerName localhost

<VirtualHost *:8091>
  MonoServerPath /usr/bin/mod-mono-server4
  DocumentRoot /home/yasser/BSS_Project/development-demo/EesassinErp/EesassinErp
  MonoApplications default "/:/home/yasser/BSS_Project/development-demo/EesassinErp/EesassinErp"
  <Directory "/home/yasser/BSS_Project/development-demo/EesassinErp/EesassinErp">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
    SetHandler mono
  </Directory>
</VirtualHost>