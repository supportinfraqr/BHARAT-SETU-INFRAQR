<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Upload Documents</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .file-list {
            margin: 10px 0;
            list-style: none;
            padding: 0;
            font-size: 14px;
            color: #555;
            text-align: left;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #ddd;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        .progress {
            height: 5px;
            background: green;
            width: 0%;
            transition: width 0.3s;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            background: #0056b3;
        }

        .remove-btn {
            background: red;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="formContainer">
        <div class="container">
            <h2>Upload Your Documents</h2>
            <p id="message" style="color: green;"></p>

            <input type="file" id="fileInput" name="file">
            <button id="addFile">Add File</button>

            <ul class="file-list" id="fileList"></ul>

            <button id="uploadButton">Upload Files</button>

            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const org_uuid = urlParams.get("org_uuid");
            const candidateId = urlParams.get("candidateId");
            const apiRoot = window.location.origin;

            if (!org_uuid || !candidateId) {
                alert("Missing organization ID or candidate ID in URL!");
                return;
            }

            const fileInput = document.getElementById("fileInput");
            const fileList = document.getElementById("fileList");
            const uploadButton = document.getElementById("uploadButton");
            const progressBar = document.getElementById("progressBar");
            const formContainer = document.getElementById("formContainer");
            const message = document.getElementById("message");

            let selectedFiles = [];

            document.getElementById("addFile").addEventListener("click", function () {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    selectedFiles.push(file);

                    let li = document.createElement("li");
                    li.className = "file-item";
                    li.innerHTML = `${file.name} <button class="remove-btn">X</button>`;

                    li.querySelector(".remove-btn").addEventListener("click", () => {
                        selectedFiles = selectedFiles.filter(f => f !== file);
                        li.remove();
                    });

                    fileList.appendChild(li);
                    fileInput.value = "";
                }
            });

            uploadButton.addEventListener("click", async function () {
                if (selectedFiles.length === 0) {
                    message.innerText = "No files selected!";
                    message.style.color = "red";  // Set error color
                    message.style.display = "block";
                    return;
                }

                const formData = new FormData();
                selectedFiles.forEach(file => formData.append("files", file));

                progressBar.style.width = "0%";
                document.querySelector(".progress-bar").style.display = "block";

                try {
                    const response = await fetch(`${apiRoot}/recruitment/uploadCandidateDocuments/${org_uuid}/${candidateId}`, {
                        method: "POST",
                        body: formData,
                    });

                    const result = await response.json();

                    if (response.ok) {
                        message.innerText = result.message || "Files uploaded successfully!";
                        message.style.color = "green"; // Success color
                        message.style.display = "block";
                    } else if (response.status === 403) {
                        message.innerText = result.message || "Access forbidden! You don't have permission.";
                        message.style.color = "red";
                        message.style.display = "block";
                    } else {
                        message.innerText = "Error uploading files!";
                        message.style.color = "red";
                        message.style.display = "block";
                    }

                    progressBar.style.width = "100%";
                } catch (error) {
                    message.innerText = "Error uploading files!";
                    message.style.color = "red";
                    message.style.display = "block";
                    console.error("Upload Error:", error);
                }
            });

        });
    </script>
</body>
