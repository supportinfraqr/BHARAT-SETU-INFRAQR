[package]
name = "bss-attendance"
version = "1.5.9"
description = "BSS attendance client"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
zip = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
