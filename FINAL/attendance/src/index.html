<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BSS Attendance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">BSS</div>
      <div>
        <h1>Attendance Client</h1>
        <p>Local camera monitoring · no video leaves this device</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="conn" class="pill muted">Connecting…</span>
      <button id="refreshBtn" class="btn ghost" type="button">Refresh</button>
      <button id="logoutBtn" class="btn ghost hidden" type="button">Sign out</button>
    </div>
  </header>

  <main id="app" class="wrap">
    <section class="card activation">
      <h2>Starting local attendance engine…</h2>
      <p class="muted">The app is starting its local camera engine. This can take a few seconds on first launch.</p>
      <p id="startupMsg" class="msg"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
