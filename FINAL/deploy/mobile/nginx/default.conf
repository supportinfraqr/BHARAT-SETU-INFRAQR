events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream frontend {
        server frontend:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name mlogin.bharatshramsetu.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name mlogin.bharatshramsetu.com;

        ssl_certificate     /etc/letsencrypt/live/mlogin.bharatshramsetu.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mlogin.bharatshramsetu.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 20m;

        # Uploads (worker photos, Aadhaar, DigiLocker docs) live on the main app
        # server — proxy /media and /static there so images resolve on the mobile host.
        location /media/ {
            proxy_pass https://login.bharatshramsetu.com;
            proxy_set_header Host login.bharatshramsetu.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;
        }
        location /static/ {
            proxy_pass https://login.bharatshramsetu.com;
            proxy_set_header Host login.bharatshramsetu.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;
        }

        # Everything else -> the mobile Next.js frontend (which proxies its own
        # /api/* route handlers to the BSS backend server-side).
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
