events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream frontend_prod {
        server frontend-prod:3000 max_fails=3 fail_timeout=10s;
    }
    # Staging upstream — used only when the staging server block below is enabled
    # (start `frontend-staging` with `docker compose --profile staging up -d`).
    upstream frontend_staging {
        server frontend-staging:3000 max_fails=3 fail_timeout=10s;
    }

    # ── Mobile PROD — mlogin.bharatshramsetu.com ─────────────────────────────
    server {
        listen 80;
        server_name mlogin.bharatshramsetu.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name mlogin.bharatshramsetu.com;

        ssl_certificate     /etc/letsencrypt/live/mlogin.bharatshramsetu.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mlogin.bharatshramsetu.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 20m;

        # Uploads (worker photos, Aadhaar, DigiLocker docs) live on the main app
        # server — proxy /media and /static there so images resolve on the mobile host.
        location /media/ {
            proxy_pass https://login.bharatshramsetu.com;
            proxy_set_header Host login.bharatshramsetu.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;
        }
        location /static/ {
            proxy_pass https://login.bharatshramsetu.com;
            proxy_set_header Host login.bharatshramsetu.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;
        }

        # Everything else -> the mobile Next.js frontend (which proxies its own
        # /api/* route handlers to the BSS backend server-side).
        location / {
            proxy_pass http://frontend_prod;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── Mobile STAGING — mlogin-staging.bharatshramsetu.com ──────────────────
    # ENABLE only after: (1) DNS A record -> 43.204.194.237, (2) certbot cert
    # issued for the staging domain, (3) `docker compose --profile staging up -d`.
    # Until then, keep this block commented so prod nginx starts cleanly.
    #
