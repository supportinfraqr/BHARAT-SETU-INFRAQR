events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000 max_fails=3 fail_timeout=10s;
    }
    upstream backend {
        server backend:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name bharat-shram-setu-staging.bharatshramsetu.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name bharat-shram-setu-staging.bharatshramsetu.com;

        ssl_certificate     /etc/letsencrypt/live/bharat-shram-setu-staging.bharatshramsetu.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bharat-shram-setu-staging.bharatshramsetu.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 20m;

        # Next.js app API routes -> frontend (browser-facing)
        location /api/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Upstream BSS contract -> Django
        location /v1/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /media/ {
            alias /data/media/;
        }
        location /static/ {
            alias /data/static/;
        }
        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else -> Next.js
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}