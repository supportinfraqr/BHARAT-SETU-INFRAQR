name: bss

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bss
      POSTGRES_PASSWORD: ${BSS_PG_PASSWORD:?BSS_PG_PASSWORD is required in deploy/.env}
      POSTGRES_DB: bss_final
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/bss_final.sql:/docker-entrypoint-initdb.d/01_bss_final.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bss -d bss_final"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../Backend
      dockerfile: ../deploy/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      BSS_DEBUG: "False"
      BSS_SECRET_KEY: ${BSS_SECRET_KEY:?BSS_SECRET_KEY is required in deploy/.env}
      BSS_PG_DB: bss_final
      BSS_PG_USER: bss
      BSS_PG_PASSWORD: ${BSS_PG_PASSWORD:?BSS_PG_PASSWORD is required in deploy/.env}
      BSS_PG_HOST: db
      BSS_PG_PORT: "5432"
      BSS_REDIS_URL: redis://redis:6379/0
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      BSS_AADHAAR_BASE_URL: ${BSS_AADHAAR_BASE_URL:-https://api.sandbox.co.in}
      BSS_AADHAAR_API_KEY: ${BSS_AADHAAR_API_KEY:?BSS_AADHAAR_API_KEY is required in deploy/.env}
      BSS_AADHAAR_API_SECRET: ${BSS_AADHAAR_API_SECRET:?BSS_AADHAAR_API_SECRET is required in deploy/.env}
      BSS_AADHAAR_API_VERSION: ${BSS_AADHAAR_API_VERSION:-1.0}
      BSS_AADHAAR_OTP_TTL_MIN: ${BSS_AADHAAR_OTP_TTL_MIN:-10}
      BSS_AADHAAR_MAX_ATTEMPTS: ${BSS_AADHAAR_MAX_ATTEMPTS:-3}
      BSS_AADHAAR_RESEND_GAP_SEC: ${BSS_AADHAAR_RESEND_GAP_SEC:-60}
      BSS_AADHAAR_MAX_RESENDS: ${BSS_AADHAAR_MAX_RESENDS:-3}
      BSS_AADHAAR_LOCK_SEC: ${BSS_AADHAAR_LOCK_SEC:-600}
      BSS_AADHAAR_MOCK: ${BSS_AADHAAR_MOCK:-}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-AIzaSyCqfNilx-gBvPdG0pVwJGm9heWjkZKPKfA}
      ATTENDANCE_CONTROL_URL: ${ATTENDANCE_CONTROL_URL:-}
      ATTENDANCE_CONTROL_TOKEN: ${ATTENDANCE_CONTROL_TOKEN:-}
      BSS_AADHAAR_PHOTO_DIR: /data/media/aadhaar
      DIGILOCKER_CLIENT_ID: ${DIGILOCKER_CLIENT_ID:?DIGILOCKER_CLIENT_ID is required in deploy/.env}
      DIGILOCKER_CLIENT_SECRET: ${DIGILOCKER_CLIENT_SECRET:?DIGILOCKER_CLIENT_SECRET is required in deploy/.env}
      DIGILOCKER_REDIRECT_URI: ${DIGILOCKER_REDIRECT_URI:-https://bharat-shram-setu-staging.bharatshramsetu.com/api/digilocker/callback}
      DIGILOCKER_DOC_DIR: /data/media/digilocker
      BSS_DEMO_OTP: ${BSS_DEMO_OTP:-}
      BSS_DEMO_OTP_MOBILES: ${BSS_DEMO_OTP_MOBILES:-}
      GUPSHUP_API_KEY: ${GUPSHUP_API_KEY:?GUPSHUP_API_KEY is required in deploy/.env}
      GUPSHUP_SOURCE: ${GUPSHUP_SOURCE:-919650887008}
      GUPSHUP_SRC_NAME: ${GUPSHUP_SRC_NAME:-Bharat Shram Setu}
      GUPSHUP_OTP_TEMPLATE_ID: ${GUPSHUP_OTP_TEMPLATE_ID:-}
      GUPSHUP_ACCOUNT_CREATED_TEMPLATE_ID: ${GUPSHUP_ACCOUNT_CREATED_TEMPLATE_ID:-fff36b04-9d58-42d0-a81a-8a09f7e527e6}
      GUPSHUP_ENABLED: ${GUPSHUP_ENABLED:-true}
      BSS_ONBOARDING_PASSWORD: ${BSS_ONBOARDING_PASSWORD:-123456}
      BSS_OTP_CHANNEL: ${BSS_OTP_CHANNEL:-sms}
      SMS_2FACTOR_API_KEY: ${SMS_2FACTOR_API_KEY:?SMS_2FACTOR_API_KEY is required in deploy/.env}
      SMS_2FACTOR_ENABLED: ${SMS_2FACTOR_ENABLED:-true}
      SMS_2FACTOR_TEMPLATE: ${SMS_2FACTOR_TEMPLATE:-Login OTP}
      BSS_TIME_ZONE: Asia/Kolkata
      BSS_JWT_ACCESS_MIN: "60"
      BSS_JWT_REFRESH_DAYS: "7"
      BSS_CORS_ALLOW_ALL: "True"
      BSS_ALLOWED_HOSTS: "*"
      BSS_SMTP_HOST: ${BSS_SMTP_HOST:-}
      BSS_SMTP_PORT: ${BSS_SMTP_PORT:-587}
      BSS_SMTP_USER: ${BSS_SMTP_USER:-}
      BSS_SMTP_PASSWORD: ${BSS_SMTP_PASSWORD:-}
      BSS_SMTP_USE_TLS: ${BSS_SMTP_USE_TLS:-1}
      BSS_SMTP_USE_SSL: ${BSS_SMTP_USE_SSL:-0}
      BSS_SMTP_TIMEOUT: ${BSS_SMTP_TIMEOUT:-20}
      BSS_MAIL_FROM: "${BSS_MAIL_FROM:-Bharat Shram Setu <no-reply@bharatshramsetu.com>}"
      BSS_CONTACT_TO_EMAIL: ${BSS_CONTACT_TO_EMAIL:-support@bharatshramsetu.com}
      BSS_CONTACT_CC_EMAIL: ${BSS_CONTACT_CC_EMAIL:-}
      BSS_STATIC_ROOT: /data/static
      BSS_MEDIA_ROOT: /data/media
      BSS_AUDIT_WORKSPACE_DIR: /data/audit
      BSS_AUDIT_JOBS_DIR: /data/audit/jobs
      BSS_AUDIT_AGENT_DIR: /app/audit_agent
      BSS_AUDIT_HANDOFF_KEY: ${BSS_AUDIT_HANDOFF_KEY:?BSS_AUDIT_HANDOFF_KEY is required in .env}
    volumes:
      - media_data:/data/media
      - static_data:/data/static
      - audit_data:/data/audit

  frontend:
    build:
      context: ../Web
      dockerfile: Dockerfile
      args:
        - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BSS_DATA_MODE: remote
      BSS_API_BASE_URL: https://bharat-shram-setu-staging.bharatshramsetu.com
      BSS_AUTH_API_URL: https://bharat-shram-setu-staging.bharatshramsetu.com
      BSS_APP_ORIGIN: https://bharat-shram-setu-staging.bharatshramsetu.com
      BSS_PAYMENT_HOSTS: checkout.razorpay.com,secure.payu.in
      BSS_SESSION_SECRET: ${BSS_SESSION_SECRET:-bss-staging-session-secret-please-change-32chars}
      BSS_API_TIMEOUT_MS: "15000"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-AIzaSyCqfNilx-gBvPdG0pVwJGm9heWjkZKPKfA}

  audit-runner:
    build:
      context: ../Backend
      dockerfile: ../deploy-staging/audit-runner/Dockerfile
    restart: unless-stopped
    networks:
      - audit_net
    volumes:
      - audit_data:/data/audit
    environment:
      BSS_AUDIT_JOBS_DIR: /data/audit/jobs
      BSS_AUDIT_AGENT_DIR: /app/audit_agent
      BSS_AUDIT_HANDOFF_KEY: ${BSS_AUDIT_HANDOFF_KEY:?BSS_AUDIT_HANDOFF_KEY is required in .env}
      DEEPSEEK_CACHE_DIR: /data/audit/cache
      BSS_AUDIT_RUNNER_POLL_SECONDS: "5"
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    cpus: "2.0"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/nginx/default.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - media_data:/data/media:ro
      - static_data:/data/static:ro

volumes:
  pgdata:
  media_data:
  static_data:
  redis_data:
  audit_data:

networks:
  audit_net:
