# Self-contained CCTV/face-attendance stack for a dedicated host.
# Brings its own Postgres so it can run on a box where the BSS stack is down.
#
#   cp .env.example .env    # set BTP_PG_PASSWORD (+ BTP_SOURCE)
#   docker compose up -d --build
#
# One pipeline process per camera: add more `attendance-<name>` services with
# their own `--camera <name>` and BTP_SOURCE later; they all share this DB and
# are told apart by the `camera` column.
name: attendance

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: btp
      POSTGRES_PASSWORD: ${BTP_PG_PASSWORD:?set BTP_PG_PASSWORD in deploy/.env}
      POSTGRES_DB: btp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btp -d btp"]
      interval: 5s
      timeout: 5s
      retries: 12

  attendance:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BTP_PG_PASSWORD: ${BTP_PG_PASSWORD}
      BTP_PG_SCHEMA: attendance
      BTP_DATABASE_URL: postgresql://btp:${BTP_PG_PASSWORD}@db:5432/btp
      # Control plane (BSS backend -> here)
      CONTROL_TOKEN: ${CONTROL_TOKEN:?set CONTROL_TOKEN in deploy/.env}
      ALLOWED_CLIENTS: ${ALLOWED_CLIENTS:-}
      # Fallback source when a start request carries none. Bundle test video
      # while there are no cameras.
      DEFAULT_SOURCE: ${DEFAULT_SOURCE:-tests/assets/cctv_sim.mp4}
    ports:
      - "80:80"
    volumes:
      - snapshots:/app/data/snapshots
      - deepface:/root/.deepface
      - ultralytics:/root/.config/Ultralytics

volumes:
  pgdata:
  snapshots:
  deepface:
  ultralytics:
