postgres:
  host: 127.0.0.1
  port: 5432
  dbname: btp            # ONE shared database for all cameras now (no btp_<name>);
                         # cameras are told apart by the `camera` column.
  user: btp
  password: ""           # NEVER commit a password. Export BTP_PG_PASSWORD, or set a
                         # full BTP_DATABASE_URL (takes precedence). On BSS prod point
                         # it at bss_prod with schema=attendance below.
  schema: ""             # BTP_PG_SCHEMA env wins. e.g. "attendance" keeps this
                         # pipeline's tables isolated inside a shared database.
paths:
  snapshots: data/snapshots

source:
  mode: auto
  webcam_index: 1   # real laptop webcam is currently index 1 (index 0 was the
                    # DroidCam virtual camera). Re-run `main.py --scan` and check
                    # data/snapshots/scan_camN.jpg if cameras stop matching.
  webcam_width: 1280   # requested HD mode (DirectShow defaults to 640x480
  webcam_height: 720   # if unset); actual size is printed on connect
  ivideon_cameras:
    - id: 100-DxWvvaN7dT4xMMEJ38TESZ:0
      name: Backup camera
    - id: 100-KqKKF3inDX3uvKrwbIGWGb:851968
      name: Yaroslavl Mashinostroiteley Avenue
    
  openwebcamdb:
    api_key: ""
    webcams:
      - yaroslavl-mashinostroiteley-avenue
  rtsp_urls:
    - rtsp://127.0.0.1:8554/cctv
  local_files: []
  reconnect_delay_s: 5

# Multi-CCTV: one pipeline process per entry, each on its own web port.
#   find available sources/ports:  python main.py --scan
#   list entries:                  python main.py --list-cameras
#   run one camera:                python main.py --camera gate
#   run all cameras:               powershell -ExecutionPolicy Bypass -File tools\run_all_cameras.ps1
cameras:
  - name: gate
    source: "1"          # same syntax as --source (webcam index / rtsp:// / file)
    web_port: 8081
  - name: lobby
    source: rtsp://127.0.0.1:8554/cctv
    web_port: 8082

detector:
  model: yolov8n.pt
  imgsz: 640
  infer_width: 640
  conf: 0.35
  iou: 0.45
  process_every: 2
  present_hits: 2
  absent_misses: 12
  track_lost_after_s: 4.0

face:
  recognition_model: ArcFace
  detector_backend: retinaface
  cosine_threshold: 0.6       # ArcFace operating point (DeepFace documented).
                               # MUST re-enroll gallery after switching models:
                               # old Facenet512 vectors are ignored automatically
                               # (gallery filters by model name -> starts empty).
  match_margin: 0.08           # ambiguity reject: best match must beat the
                               # runner-up (other person) by this much, else
                               # Unknown instead of a guess. 0 = old behavior.
                               # Kills lookalike flips; costs a few extra
                               # Visitor frames on genuinely ambiguous views.
  match_topk: 3                # KNN vote: majority of these nearest gallery
  match_votes: 2               # images must agree to name someone (2 of 3).
                               # A single matching image can never name anyone
                               # by itself. Searched via FAISS, not a loop.
  enroll_outlier_max: 0.55     # enrollment pruning: refuse a photo further than
                               # this from the person's own accepted cluster
                               # (background face / misfiled photo). First photo
                               # always accepted. Lower = pickier gallery.
  refresh_interval_s: 2.0
  min_blur: 15                 # 720p laptop-cam tune (was 25): fixed-focus laptop
                               # sensors run soft at 1.5-2m; 25 was eating real
                               # match attempts. 0 = disable. Raise toward 25-40
                               # only if false accepts appear.
  antispoof_enabled: false       # reject photos-on-screen / printouts: they never
                               # match, get no age, and show as Visitor. Needs
                               # onnxruntime + ~2 MB weights (auto-downloaded).
  antispoof_threshold: 0.4      # tuned on YOUR photos: genuine worst 0.61, spoofs
                               # <= 0.01, so 0.4 keeps every real pass with margin
                               # while still crushing photo attacks (raise = stricter)
  antispoof_model: data/models/minifasnetv2.onnx
  age_enabled: true
  age_smooth_window: 5       # median over last N age estimates per track (stable display, no flicker)
  age_reestimate_every: 3    # once window is full, re-estimate every Nth refresh (~6s)
  annotate_unknowns: false   # false = non-enrolled faces (Unknown + auto ID-XXXX) get a
                             # neutral Visitor box only; the DB match check still runs
                             # and sightings are still logged. true = old labeled output.
  auto_register: true
  auto_register_margin: 0.80   # grey-zone ceiling, rescaled from 0.45 for ArcFace
  auto_register_min_seen_s: 0.5
  auto_register_min_face_px: 60   # 720p tune (was 50): faces under 60px are beyond
                               # ~2.5m and never match reliably; skip them so bad
                               # frames can't poison decisions. Working zone at
                               # 1.5-2m is ~75-110px, unaffected.
  reassign_margin: 0.90          # rescaled from 0.55 for ArcFace
  identity_patience: 2           # was 1: name locks need sustained evidence,
                                 # single noisy frames can't flip identity

qr:
  enabled: true
  cooldown_s: 10.0
  max_width: 640          # fast pass (near codes); full-resolution distance
  fullres_fallback: true  # pass runs only when the fast pass finds nothing
  fullres_width: 1280     # cap for the distance pass (perf guard)
  match_threshold: 0.82
  auto_register: true
  auto_register_max_score: 0.55

vitality:
  weights:
    age: 0.45
    motion: 0.25
    posture: 0.15
    activity: 0.15
  age_curve:
    full_score_age: 20
    zero_score_age: 90
  motion_window_s: 8.0
  active_motion_threshold: 0.02

display:
  show: true
  window_name: BTP CCTV Analytics
  # --- STAGED UX ideas (disabled by default) ---
  # Flip any of these to `true` and restart — no code change needed.
  roster_enabled: true       # idea 3: right-side "who's in frame" panel
  roster_max_entries: 6       # max rows shown before "+N more"
  face_zoom_enabled: false    # idea 1: magnified face inset, top-right
  face_zoom_size: 220         # inset width in px at 960 baseline (auto-scaled)
