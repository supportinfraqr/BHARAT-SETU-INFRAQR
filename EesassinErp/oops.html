<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 480px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        img {
            width: 160px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }

            a:hover {
                background: #0056b3;
            }
    </style>

</head>

<body>

    <div class="box">

        <img src="https://cdn-icons-png.flaticon.com/512/6134/6134065.png" alt="error">

        <h1>Oops!</h1>

        <p>
            The page you are trying to access is unavailable or you do not have permission to view it.
        </p>

        <p>
            Please try again later or return to the homepage.
        </p>

        <a href="/">Go to Home</a>

    </div>

</body>
</html>
