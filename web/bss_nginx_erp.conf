server {
    listen 80 default_server;
    server_name bharat-sharansetu.infraqr.com bharat-setu.infraqr.com localhost;

    # Client ASP.NET ERP (EesassinErp) served via mono/mod-mono on 8091
    root /home/yasser/BSS_Project/development-demo/EesassinErp/EesassinErp;
    index index.html;

    # Case-insensitive rewrites for static folders (prevents case-sensitivity issues on Linux/Mono)
    rewrite (?i)^/scripts/(.*)$ /scripts/$1 break;
    rewrite (?i)^/content/(.*)$ /Content/$1 break;
    rewrite (?i)^/uploads/(.*)$ /Uploads/$1 break;

    # ERP pages + login + QR screens
    location /QR/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location ~* ^/(login\.aspx|.*\.aspx|.*\.ashx|.*\.asmx) {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ERP proxy to Django QR backend
    location /api/QRBridge/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Backend API -> development-demo Django QR backend on 8002
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Root + legacy /login.aspx -> ERP MVC login (avoids dashboard iTextSharp mono issue)
    location = / {
        return 302 /Login/Login;
    }
    location = /login.aspx {
        return 302 /Login/Login;
    }

    # Everything else -> the ERP
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Serve static assets directly from the root filesystem (prevents missing files from triggering C# errors)
    location ~* \.js$ {
        try_files $uri =404;
        default_type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location ~* \.css$ {
        try_files $uri =404;
        default_type "text/css; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
    }
}