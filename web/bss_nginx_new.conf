server {
    listen 80 default_server;
    server_name bharat-sharansetu.infraqr.com bharat-setu.infraqr.com localhost;

    # development-demo landing page (QR Attendance system)
    root /home/yasser/BSS_Project/development-demo/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy -> development-demo Django QR backend on 8002
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}