name: Attendance client build

on:
  workflow_dispatch:
  push:
    tags:
      - 'attendance-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            exe: .exe
          - os: ubuntu-22.04
            artifact: linux
            exe: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      - name: Install engine dependencies
        working-directory: FINAL/attendance/engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Python sidecar
        working-directory: FINAL/attendance
        run: |
          python build_engine.py
          python -c "import shutil; [shutil.rmtree(p, ignore_errors=True) for p in ('build-work','build-dist','build-spec')]"
          python -m pip cache purge || true

      - name: Sign Windows sidecar
        if: runner.os == 'Windows'
        working-directory: FINAL/attendance
        shell: pwsh
        env:
          BSS_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.BSS_WINDOWS_SIGNING_PFX_BASE64 }}
          BSS_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.BSS_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./sign_windows.ps1 -Pattern "src-tauri/binaries/attendance-engine-*.exe"

      - name: Install Tauri CLI
        working-directory: FINAL/attendance
        run: npm install

      - name: Build Tauri bundle
        working-directory: FINAL/attendance
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BSS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BSS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm run build -- --bundles nsis,msi
          else
            npm run build -- --bundles appimage
          fi

      - name: Sign Windows installers
        if: runner.os == 'Windows'
        working-directory: FINAL/attendance
        shell: pwsh
        env:
          BSS_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.BSS_WINDOWS_SIGNING_PFX_BASE64 }}
          BSS_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.BSS_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./sign_windows.ps1 -Pattern "src-tauri/target/release/bundle/nsis/*.exe"
          ./sign_windows.ps1 -Pattern "src-tauri/target/release/bundle/msi/*.msi"

      - name: Re-sign Windows updater artifact
        if: runner.os == 'Windows'
        working-directory: FINAL/attendance
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BSS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BSS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            npx tauri signer sign -k $env:TAURI_SIGNING_PRIVATE_KEY -p $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD --app-version $version $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Updater signing failed: $($_.FullName)" }
          }

      - name: Collect artifacts
        working-directory: FINAL/attendance
        shell: bash
        run: |
          mkdir -p executable/${{ matrix.artifact }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe executable/${{ matrix.artifact }}/ || true
            cp src-tauri/target/release/bundle/nsis/*.exe.sig executable/${{ matrix.artifact }}/ || true
            cp src-tauri/target/release/bundle/msi/*.msi executable/${{ matrix.artifact }}/ || true
            cp src-tauri/target/release/bundle/msi/*.msi.sig executable/${{ matrix.artifact }}/ || true
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage executable/${{ matrix.artifact }}/ || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig executable/${{ matrix.artifact }}/ || true
            cp src-tauri/target/release/bundle/deb/*.deb executable/${{ matrix.artifact }}/ || true
          fi
          ls -lh executable/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: bss-attendance-${{ matrix.artifact }}
          path: FINAL/attendance/executable/${{ matrix.artifact }}/*
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bss-attendance-windows
          path: FINAL/attendance/download/windows

      - uses: actions/download-artifact@v4
        with:
          name: bss-attendance-linux
          path: FINAL/attendance/download/linux

      - name: Build update manifest
        working-directory: FINAL/attendance
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import shutil
          from pathlib import Path

          root = Path('download')
          out = Path('updates')
          out.mkdir(parents=True, exist_ok=True)
          version = json.loads(Path('package.json').read_text(encoding='utf-8'))['version']
          base = 'https://login.bharatshramsetu.com/downloads/attendance/updates'

          win_exe = next(p for p in (root / 'windows').glob('*.exe') if not p.name.endswith('.sig'))
          win_sig = Path(str(win_exe) + '.sig')
          linux_app = next((root / 'linux').glob('*.AppImage'))
          linux_sig = Path(str(linux_app) + '.sig')
          if not win_sig.exists() or not linux_sig.exists():
              raise SystemExit('Missing updater signature file')

          win_name = f'BSS-Attendance-{version}-Windows-Setup.exe'
          linux_name = f'BSS-Attendance-{version}-Linux.AppImage'
          shutil.copy2(win_exe, out / win_name)
          shutil.copy2(win_sig, out / f'{win_name}.sig')
          shutil.copy2(linux_app, out / linux_name)
          shutil.copy2(linux_sig, out / f'{linux_name}.sig')
          for name in ('*.msi', '*.msi.sig', '*.deb'):
              for path in (root / 'windows').glob(name):
                  shutil.copy2(path, out / path.name)
              for path in (root / 'linux').glob(name):
                  shutil.copy2(path, out / path.name)

          manifest = {
              'version': version,
              'notes': f'BSS Attendance {version}',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': {
                  'windows-x86_64': {
                      'signature': win_sig.read_text(encoding='utf-8').strip(),
                      'url': f'{base}/{win_name}',
                  },
                  'linux-x86_64': {
                      'signature': linux_sig.read_text(encoding='utf-8').strip(),
                      'url': f'{base}/{linux_name}',
                  },
              },
          }
          (out / 'latest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          for path in sorted(out.iterdir()):
              print(path.name, path.stat().st_size)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: bss-attendance-updates
          path: FINAL/attendance/updates/*
          if-no-files-found: error
