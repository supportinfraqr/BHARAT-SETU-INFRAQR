name: Attendance client build

on:
  workflow_dispatch:
  push:
    tags:
      - 'attendance-v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            exe: .exe
          - os: ubuntu-22.04
            artifact: linux
            exe: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      - name: Install engine dependencies
        working-directory: FINAL/attendance/engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Python sidecar
        working-directory: FINAL/attendance
        shell: bash
        run: |
          set -o pipefail
          (python build_engine.py 2>&1) | tee sidecar-build.log
          if [ "${{ runner.os }}" = "Linux" ]; then
            python build_headless.py
          fi
          python -c "import shutil; [shutil.rmtree(p, ignore_errors=True) for p in ('build-work','build-dist','build-spec')]"
          python -m pip cache purge || true

      - name: Sign Windows sidecar
        if: runner.os == 'Windows'
        working-directory: FINAL/attendance
        shell: pwsh
        env:
          BSS_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.BSS_WINDOWS_SIGNING_PFX_BASE64 }}
          BSS_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.BSS_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./sign_windows.ps1 -Pattern "src-tauri/binaries/attendance-engine-*.exe"

      - name: Install Tauri CLI
        working-directory: FINAL/attendance
        run: npm install

      - name: Build Tauri bundle
        working-directory: FINAL/attendance
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BSS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BSS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            (npm run build -- --verbose --bundles nsis 2>&1) | tee tauri-build.log
          else
            (npm run build -- --verbose --bundles appimage 2>&1) | tee tauri-build.log
          fi

      - name: Upload Tauri log on failure
        if: failure()
        working-directory: FINAL/attendance
        shell: bash
        env:
          BSS_DEPLOY_SSH_KEY: ${{ secrets.BSS_DEPLOY_SSH_KEY }}
          BSS_DEPLOY_HOST: ${{ secrets.BSS_DEPLOY_HOST }}
          BSS_DEPLOY_USER: ${{ secrets.BSS_DEPLOY_USER }}
          BSS_DEPLOY_PATH: ${{ secrets.BSS_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BSS_DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/bss_deploy
          chmod 700 ~/.ssh; chmod 600 ~/.ssh/bss_deploy
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/bss_deploy "$BSS_DEPLOY_USER@$BSS_DEPLOY_HOST" "mkdir -p '$BSS_DEPLOY_PATH/.incoming-$GITHUB_RUN_ID/${{ matrix.artifact }}'"
          for log in tauri-build.log sidecar-build.log; do
            if [ -f "$log" ]; then
              scp -q -o StrictHostKeyChecking=no -i ~/.ssh/bss_deploy "$log" "$BSS_DEPLOY_USER@$BSS_DEPLOY_HOST:$BSS_DEPLOY_PATH/.incoming-$GITHUB_RUN_ID/${{ matrix.artifact }}/$log" || true
            fi
          done

      - name: Sign Windows installers
        if: runner.os == 'Windows'
        working-directory: FINAL/attendance
        shell: pwsh
        env:
          BSS_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.BSS_WINDOWS_SIGNING_PFX_BASE64 }}
          BSS_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.BSS_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./sign_windows.ps1 -Pattern "src-tauri/target/release/bundle/nsis/*.exe"
          ./sign_windows.ps1 -Pattern "src-tauri/target/release/bundle/msi/*.msi"

      - name: Re-sign Windows updater artifact
        if: runner.os == 'Windows'
        working-directory: FINAL/attendance
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BSS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BSS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            npx tauri signer sign -k $env:TAURI_SIGNING_PRIVATE_KEY -p $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD --app-version $version $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Updater signing failed: $($_.FullName)" }
          }

      - name: Collect artifacts
        working-directory: FINAL/attendance
        shell: bash
        run: |
          mkdir -p executable/${{ matrix.artifact }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe executable/${{ matrix.artifact }}/ || true
            cp src-tauri/target/release/bundle/nsis/*.exe.sig executable/${{ matrix.artifact }}/ || true
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage executable/${{ matrix.artifact }}/ || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig executable/${{ matrix.artifact }}/ || true
            cp src-tauri/target/release/bundle/deb/*.deb executable/${{ matrix.artifact }}/ || true
            cp build-headless/*.tar.gz build-headless/*.sha256 executable/${{ matrix.artifact }}/ || true
          fi
          ls -lh executable/${{ matrix.artifact }}

      - name: Prepare production SSH
        shell: bash
        env:
          BSS_DEPLOY_SSH_KEY: ${{ secrets.BSS_DEPLOY_SSH_KEY }}
          BSS_DEPLOY_HOST: ${{ secrets.BSS_DEPLOY_HOST }}
          BSS_DEPLOY_USER: ${{ secrets.BSS_DEPLOY_USER }}
          BSS_DEPLOY_PATH: ${{ secrets.BSS_DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BSS_DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/bss_deploy
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/bss_deploy
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/bss_deploy "$BSS_DEPLOY_USER@$BSS_DEPLOY_HOST" "mkdir -p '$BSS_DEPLOY_PATH/.incoming-$GITHUB_RUN_ID/${{ matrix.artifact }}'"

      - name: Upload directly to production
        working-directory: FINAL/attendance
        shell: bash
        env:
          BSS_DEPLOY_HOST: ${{ secrets.BSS_DEPLOY_HOST }}
          BSS_DEPLOY_USER: ${{ secrets.BSS_DEPLOY_USER }}
          BSS_DEPLOY_PATH: ${{ secrets.BSS_DEPLOY_PATH }}
        run: |
          scp -q -r -o StrictHostKeyChecking=no -i ~/.ssh/bss_deploy executable/${{ matrix.artifact }}/* "$BSS_DEPLOY_USER@$BSS_DEPLOY_HOST:$BSS_DEPLOY_PATH/.incoming-$GITHUB_RUN_ID/${{ matrix.artifact }}/"

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare production SSH
        shell: bash
        env:
          BSS_DEPLOY_SSH_KEY: ${{ secrets.BSS_DEPLOY_SSH_KEY }}
          BSS_DEPLOY_HOST: ${{ secrets.BSS_DEPLOY_HOST }}
          BSS_DEPLOY_USER: ${{ secrets.BSS_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$BSS_DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/bss_deploy
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/bss_deploy

      - name: Publish update manifest and stable links
        shell: bash
        env:
          BSS_DEPLOY_HOST: ${{ secrets.BSS_DEPLOY_HOST }}
          BSS_DEPLOY_USER: ${{ secrets.BSS_DEPLOY_USER }}
          BSS_DEPLOY_PATH: ${{ secrets.BSS_DEPLOY_PATH }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('FINAL/attendance/package.json'))['version'])")
          scp -q -o StrictHostKeyChecking=no -i ~/.ssh/bss_deploy FINAL/attendance/publish_update.py "$BSS_DEPLOY_USER@$BSS_DEPLOY_HOST:/tmp/bss_publish_update_$GITHUB_RUN_ID.py"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/bss_deploy "$BSS_DEPLOY_USER@$BSS_DEPLOY_HOST" "python3 /tmp/bss_publish_update_$GITHUB_RUN_ID.py --version '$VERSION' --run-id '$GITHUB_RUN_ID' --root '$BSS_DEPLOY_PATH'"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/bss_deploy "$BSS_DEPLOY_USER@$BSS_DEPLOY_HOST" "rm -f /tmp/bss_publish_update_$GITHUB_RUN_ID.py"
